  that publishes no discovery document. NO pointer is emitted from this file:
  it records a verified absence, not a served surface. There is no security.txt, no OpenID or
  OAuth discovery document, no api-catalog, no ai-plugin.json, no agent card (neither the
  canonical /.well-known/agent-card.json nor the legacy /.well-known/agent.json) and no
  aauth-resource.json on any host.
