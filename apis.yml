description: >-
  Collision was the major annual North American technology conference organized
  by Web Summit, held in Toronto from 2019 through 2024 and widely dubbed the
  "Olympics of Tech." Beginning in 2025, the event was relocated to the
  Vancouver Convention Centre and rebranded as Web Summit Vancouver, aligning
  with the global Web Summit family (Lisbon, Rio, Doha, Qatar). Web Summit
  Vancouver is contracted through at least 2027 and was held May 27-30, 2025;
  Web Summit Vancouver 2026 is scheduled for May 11-14, 2026. The Collision
  brand is retired but this profile is preserved for historical reference.
  Collision/Web Summit does not publish a public developer REST API; the
  conference operates speaker, partner, attendee, and press portals.
